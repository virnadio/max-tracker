<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Max Reactivity Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f172a">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --green: #22c55e;
    --yellow: #eab308;
    --orange: #f97316;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    min-height: 100vh;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.6rem; color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .stats {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 16px 0;
    flex-wrap: nowrap;
  }
  .stat {
    background: var(--card);
    padding: 12px 8px;
    border-radius: 12px;
    text-align: center;
    flex: 1;
    min-width: 0;
  }
  .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.7rem; color: var(--muted); line-height: 1.2; }
  .calendar-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .calendar-nav button {
    background: var(--card);
    border: none;
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .month-title { font-size: 1.3rem; font-weight: 600; }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 6px;
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day {
    aspect-ratio: 1;
    background: var(--card);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: 600;
    position: relative;
    transition: transform 0.1s;
  }
  .day:active { transform: scale(0.95); }
  .day.other-month { opacity: 0.3; }
  .day.has-incidents { font-weight: 700; }
  .day-num { font-size: 0.95rem; }
  .incident-count {
    font-size: 0.7rem;
    background: rgba(0,0,0,0.5);
    padding: 1px 5px;
    border-radius: 8px;
    margin-top: 2px;
  }
  .severity-0 { background: #166534; } /* calm */
  .severity-1 { background: #65a30d; }
  .severity-2 { background: #ca8a04; }
  .severity-3 { background: #ea580c; }
  .severity-4, .severity-5 { background: #b91c1c; }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    padding: 16px;
    overflow-y: auto;
  }
  .modal-content {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    max-width: 500px;
    margin: 40px auto;
  }
  .modal h2 { margin-bottom: 16px; color: var(--accent); }
  label { display: block; margin: 12px 0 4px; font-size: 0.9rem; color: var(--muted); }
  select, input, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 1rem;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  button.primary {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    flex: 1;
    cursor: pointer;
  }
  button.secondary {
    background: #334155;
    color: var(--text);
    border: none;
    padding: 14px;
    border-radius: 12px;
    flex: 1;
    cursor: pointer;
  }
  .incidents-list { margin-top: 16px; }
  .incident-item {
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 0.9rem;
  }
  .incident-thumb-wrap {
    position: relative;
    width: 100%;
    height: 200px;
    overflow: hidden;
    border-radius: 8px;
    margin-top: 8px;
    background: #0f172a;
    cursor: grab;
    touch-action: none;
  }
  .incident-thumb-wrap:active { cursor: grabbing; }
  .incident-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  .photo-hint {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
  }
  .export-btn {
    display: block;
    margin: 20px auto;
    background: #334155;
    color: var(--text);
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    cursor: pointer;
  }
  .export-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 20px auto;
  }
  .export-row .export-btn { margin: 0; }
  .sync-settings {
    max-width: 500px;
    margin: 0 auto 20px;
    background: var(--card);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .sync-settings summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
  .sync-status { color: var(--muted); font-size: 0.8rem; margin-top: 10px; min-height: 1em; }
  .legend {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
    font-size: 0.75rem;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; }
  .dog-photo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 12px 0 8px;
  }
  .dog-photo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
    background: var(--card);
    cursor: pointer;
  }
  .photo-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid #475569;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    display: inline-block;
    text-align: center;
  }
  /* Full-screen pinch-zoom photo viewer for incident photos */
  .photo-viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.92);
    touch-action: none;
    overscroll-behavior: none;
  }
  .photo-viewer.open { display: block; }
  body.photo-viewer-open {
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }
  .photo-viewer-close {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 2;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(30, 41, 59, 0.95);
    color: var(--text);
    font-size: 1.75rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .photo-viewer-close:hover,
  .photo-viewer-close:focus {
    background: var(--accent);
    color: #0f172a;
    outline: none;
  }
  .photo-viewer-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  .photo-viewer-stage:active { cursor: grabbing; }
  .photo-viewer-stage img {
    position: absolute;
    top: 0;
    left: 0;
    max-width: none;
    max-height: none;
    transform-origin: 0 0;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
  }
  .photo-viewer-hint {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-size: 0.75rem;
    color: rgba(241,245,249,0.6);
    background: rgba(15,23,42,0.55);
    padding: 4px 10px;
    border-radius: 6px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Log Incident</h2>
    <div id="dayIncidents" class="incidents-list"></div>
    <form id="incidentForm">
      <label>Trigger (visual / startle)</label>
      <select id="trigger" required>
        <option value="dog">Another dog</option>
        <option value="person">Person</option>
        <option value="bike">Bike / scooter</option>
        <option value="car">Car / vehicle</option>
        <option value="sound-startle">Startle (sudden movement)</option>
        <option value="other">Other</option>
      </select>
      <label>Approximate distance</label>
      <select id="distance">
        <option value="very-far">> 30m</option>
        <option value="far">15-30m</option>
        <option value="medium">5-15m</option>
        <option value="close">< 5m</option>
      </select>
      <label>Severity (how intense?)</label>
      <select id="severity" required>
        <option value="1">1 - Noticed, recovered quickly</option>
        <option value="2">2 - Mild reaction</option>
        <option value="3">3 - Moderate (lunging / vocalizing)</option>
        <option value="4">4 - Strong reaction</option>
        <option value="5">5 - Intense / hard to redirect</option>
      </select>
      <label>Recovery time</label>
      <select id="recovery">
        <option value="instant">Instant</option>
        <option value="<10s">Under 10 seconds</option>
        <option value="10-30s">10–30 seconds</option>
        <option value="30-60s">30–60 seconds</option>
        <option value=">1min">Over 1 minute</option>
      </select>
      <label>Handler cue used</label>
      <input type="text" id="cue" placeholder="e.g. Look, U-turn, treat scatter...">
      <label>Notes</label>
      <textarea id="notes" rows="2" placeholder="What happened, body language, what helped..."></textarea>
      <label>Photo of trigger dog / incident (optional)</label>
      <input type="file" id="incidentPhoto" accept="image/*" style="margin-top:4px;">
      <div class="btn-row">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button type="button" class="primary" id="saveBtn">Save Incident</button>
      </div>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = 'max_reactivity_v1';
const PHOTO_KEY = 'max_profile_photo';
let currentDate = new Date();
let selectedDate = null;
let editingIndex = null; // null = adding new, number = editing existing

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadPhoto() {
  // Profile photo is embedded; optional override from localStorage
  const photo = localStorage.getItem(PHOTO_KEY);
  const img = document.getElementById('dogPhoto');
  if (photo) img.src = photo;
  img.style.display = 'block';
}

function savePhoto(dataUrl) {
  localStorage.setItem(PHOTO_KEY, dataUrl);
  loadPhoto();
}

function getDateKey(d) {
  // Local date key (YYYY-MM-DD) — avoids timezone shift bugs
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById('monthTitle').textContent = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startPad = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  const data = loadData();

  // Previous month padding
  const prevMonthLast = new Date(year, month, 0).getDate();
  for (let i = startPad - 1; i >= 0; i--) {
    const div = document.createElement('div');
    div.className = 'day other-month';
    div.textContent = prevMonthLast - i;
    cal.appendChild(div);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const key = getDateKey(date);
    const incidents = data[key] || [];
    const div = document.createElement('div');
    div.className = 'day';
    if (incidents.length) {
      const maxSev = Math.max(...incidents.map(i => parseInt(i.severity) || 1));
      div.classList.add(`severity-${Math.min(maxSev, 5)}`);
      div.classList.add('has-incidents');
    }
    div.innerHTML = `<div class="day-num">${d}</div>` +
      (incidents.length ? `<div class="incident-count">${incidents.length}</div>` : '');
    div.onclick = () => openModal(date);
    cal.appendChild(div);
  }

  // Next month padding
  const totalCells = startPad + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    const div = document.createElement('div');
    div.className = 'day other-month';
    div.textContent = i;
    cal.appendChild(div);
  }

  updateStats();
}

function updateStats() {
  const data = loadData();
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  let total = 0, sevSum = 0, daysWith = 0;
  Object.entries(data).forEach(([key, incs]) => {
    // Parse as local date
    const [y, m, d] = key.split('-').map(Number);
    if (y === year && (m - 1) === month) {
      total += incs.length;
      incs.forEach(i => sevSum += parseInt(i.severity) || 0);
      if (incs.length) daysWith++;
    }
  });
  const avg = total ? (sevSum / total).toFixed(1) : '—';
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Incidents</div></div>
    <div class="stat"><div class="stat-num">${daysWith}</div><div class="stat-label">Days with reaction</div></div>
    <div class="stat"><div class="stat-num">${avg}</div><div class="stat-label">Avg severity</div></div>
  `;
}

function openModal(date) {
  selectedDate = date;
  const key = getDateKey(date);
  const data = loadData();
  const incidents = data[key] || [];
  document.getElementById('modalTitle').textContent = date.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
  
  const list = document.getElementById('dayIncidents');
  list.innerHTML = incidents.length ? incidents.map((i, idx) => `
    <div class="incident-item">
      <strong>${i.trigger}</strong> • ${i.distance} • Sev ${i.severity}<br>
      Recovery: ${i.recovery} • Cue: ${i.cue || '—'}<br>
      <em>${i.notes || ''}</em>
      ${i.photo ? `
        <div class="incident-thumb-wrap" data-idx="${idx}">
          <img class="incident-thumb" src="${i.photo}" style="object-position: ${i.photoPosition || '50% 50%'};" alt="incident photo">
          <div class="photo-hint">Drag to center · Tap to zoom</div>
        </div>
      ` : ''}
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button type="button" class="edit-btn" data-idx="${idx}" style="background:#1e40af;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:0.8rem;">Edit</button>
        <button type="button" class="delete-btn" data-idx="${idx}" style="background:#7f1d1d;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:0.8rem;">Delete</button>
      </div>
    </div>
  `).join('') : '<p style="color:#94a3b8;margin-bottom:12px;">No incidents logged this day.</p>';

  // Wire drag-to-center on photos; short tap opens zoom viewer
  list.querySelectorAll('.incident-thumb-wrap').forEach(wrap => {
    const img = wrap.querySelector('img');
    const idx = parseInt(wrap.dataset.idx);
    let startX, startY, startPosX = 50, startPosY = 50;
    let isPointerDown = false;
    let didDrag = false;
    const DRAG_THRESHOLD = 8;

    const parsePos = () => {
      const style = img.style.objectPosition || '50% 50%';
      const [x, y] = style.split(' ').map(v => parseFloat(v) || 50);
      return { x, y };
    };

    const savePos = (x, y) => {
      const data = loadData();
      const key = getDateKey(selectedDate);
      if (data[key] && data[key][idx]) {
        data[key][idx].photoPosition = `${Math.max(0, Math.min(100, x))}% ${Math.max(0, Math.min(100, y))}%`;
        saveData(data);
      }
    };

    const onStart = (e) => {
      if (e.touches && e.touches.length > 1) return;
      isPointerDown = true;
      didDrag = false;
      const p = parsePos();
      startPosX = p.x;
      startPosY = p.y;
      const point = e.touches ? e.touches[0] : e;
      startX = point.clientX;
      startY = point.clientY;
      wrap.style.cursor = 'grabbing';
      e.preventDefault();
    };

    const onMove = (e) => {
      if (!isPointerDown) return;
      const point = e.touches ? e.touches[0] : e;
      const dx = point.clientX - startX;
      const dy = point.clientY - startY;
      if (!didDrag && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
      didDrag = true;
      const newX = startPosX - dx / 4;
      const newY = startPosY - dy / 4;
      img.style.objectPosition = `${Math.max(0, Math.min(100, newX))}% ${Math.max(0, Math.min(100, newY))}%`;
      e.preventDefault();
    };

    const onEnd = () => {
      if (!isPointerDown) return;
      isPointerDown = false;
      wrap.style.cursor = 'grab';
      if (didDrag) {
        const p = parsePos();
        savePos(p.x, p.y);
      } else {
        openPhotoViewer(img.src);
      }
    };

    wrap.addEventListener('mousedown', onStart);
    wrap.addEventListener('touchstart', onStart, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);
    window.addEventListener('touchcancel', onEnd);
  });

  // Wire up edit buttons
  list.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      const incident = incidents[idx];
      if (!incident) return;
      editingIndex = idx;
      document.getElementById('trigger').value = incident.trigger || 'dog';
      document.getElementById('distance').value = incident.distance || 'far';
      document.getElementById('severity').value = incident.severity || '3';
      document.getElementById('recovery').value = incident.recovery || '10-30s';
      document.getElementById('cue').value = incident.cue || '';
      document.getElementById('notes').value = incident.notes || '';
      document.getElementById('incidentPhoto').value = '';
      document.getElementById('saveBtn').textContent = 'Update Incident';
      document.getElementById('modalTitle').textContent = 'Edit incident';
      // Scroll form into view
      document.getElementById('incidentForm').scrollIntoView({ behavior: 'smooth' });
    };
  });

  // Wire up delete buttons
  list.querySelectorAll('.delete-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      const fresh = loadData();
      if (fresh[key] && fresh[key][idx]) {
        fresh[key].splice(idx, 1);
        if (fresh[key].length === 0) delete fresh[key];
        saveData(fresh);
        openModal(date); // refresh the modal
        renderCalendar();
      }
    };
  });

  document.getElementById('modal').style.display = 'block';
  // Reset form and edit state when opening fresh
  editingIndex = null;
  document.getElementById('incidentForm').reset();
  document.getElementById('saveBtn').textContent = 'Save Incident';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  editingIndex = null;
  document.getElementById('saveBtn').textContent = 'Save Incident';
}

// Use click handler instead of form submit to avoid accidental double-submits on mobile
document.getElementById('incidentForm').onsubmit = (e) => {

};

document.getElementById('saveBtn').onclick = (e) => {

function addIncident() {
  if (!selectedDate) return;
  const key = getDateKey(selectedDate);
  const data = loadData();
  if (!data[key]) data[key] = [];

  const photoInput = document.getElementById('incidentPhoto');
  const file = photoInput.files[0];

  const finish = (photoData) => {
    const updated = {
      trigger: document.getElementById('trigger').value,
      distance: document.getElementById('distance').value,
      severity: document.getElementById('severity').value,
      recovery: document.getElementById('recovery').value,
      cue: document.getElementById('cue').value,
      notes: document.getElementById('notes').value,
      time: new Date().toISOString()
    };

    if (!updated.trigger) return;

    let prevId = null;
    if (editingIndex !== null && data[key] && data[key][editingIndex]) {
      // Update existing — keep old photo unless a new one was chosen
      const old = data[key][editingIndex];
      prevId = old.time || null;
      updated.photo = photoData || old.photo || null;
      updated.photoPosition = old.photoPosition || null;
      data[key][editingIndex] = updated;
    } else {
      // Add new
      updated.photo = photoData || null;
      data[key].push(updated);
    }

    saveData(data);
    syncIncident(key, updated, prevId);
    closeModal();
    renderCalendar();
    photoInput.value = '';
    editingIndex = null;
  };

  if (file) {
    // Resize/compress to keep localStorage from filling up
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressed = canvas.toDataURL('image/jpeg', 0.7);
        finish(compressed);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  } else {
    finish(null);
  }
}

// ---- Export to Excel (SheetJS, loaded on demand; no photos) ----
const XLSX_CDN = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
const XL_LABELS = {
  trigger: { 'dog': 'Another dog', 'person': 'Person', 'bike': 'Bike / scooter', 'car': 'Car / vehicle', 'sound-startle': 'Startle (sudden movement)', 'other': 'Other' },
  distance: { 'very-far': '> 30m', 'far': '15-30m', 'medium': '5-15m', 'close': '< 5m' },
  recovery: { 'instant': 'Instant', '<10s': 'Under 10 seconds', '10-30s': '10–30 seconds', '30-60s': '30–60 seconds', '>1min': 'Over 1 minute' }
};
const XL_SEV_LABELS = ['', '1 - Noticed', '2 - Mild', '3 - Moderate', '4 - Strong', '5 - Intense'];
function xlLabel(kind, v) { return (XL_LABELS[kind] && XL_LABELS[kind][v]) || (v || ''); }
function xlPad(n) { return String(n).padStart(2, '0'); }
function xlLocalTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}-${xlPad(d.getMonth() + 1)}-${xlPad(d.getDate())} ${xlPad(d.getHours())}:${xlPad(d.getMinutes())}`;
}
function xlRound(n) { return Math.round(n * 100) / 100; }

function buildIncidentRows(data) {
  const rows = [];
  Object.keys(data || {}).sort().forEach(date => {
    (data[date] || []).forEach(i => {
      const sev = parseInt(i.severity);
      rows.push({
        'Date': date,
        'Logged at (local time)': xlLocalTime(i.time),
        'Trigger': xlLabel('trigger', i.trigger),
        'Distance': xlLabel('distance', i.distance),
        'Severity (1-5)': isNaN(sev) ? '' : sev,
        'Recovery': xlLabel('recovery', i.recovery),
        'Cue used': (i.cue || '').trim(),
        'Notes': (i.notes || '').trim(),
        'Has photo': i.photo ? 'Yes' : 'No',
        _t: i.time || ''
      });
    });
  });
  rows.sort((a, b) => a.Date === b.Date ? (a._t < b._t ? -1 : a._t > b._t ? 1 : 0) : (a.Date < b.Date ? -1 : 1));
  rows.forEach(r => delete r._t);
  return rows;
}

function buildSummaryAoa(rows) {
  const sevs = rows.map(r => r['Severity (1-5)']).filter(s => s !== '');
  const avg = sevs.length ? xlRound(sevs.reduce((a, b) => a + b, 0) / sevs.length) : '';
  const dates = rows.map(r => r.Date).sort();
  const aoa = [["Max's reactivity summary"], [],
    ['Total incidents', rows.length],
    ['Days with incidents', new Set(dates).size],
    ['First incident', dates[0] || ''],
    ['Last incident', dates[dates.length - 1] || ''],
    ['Average severity', avg],
    ['Max severity', sevs.length ? Math.max(...sevs) : ''],
    ['Incidents with photo', rows.filter(r => r['Has photo'] === 'Yes').length]];
  const group = (title, col, order) => {
    const g = {};
    rows.forEach(r => { (g[r[col]] = g[r[col]] || []).push(r['Severity (1-5)']); });
    const keys = order.filter(k => g[k]).concat(Object.keys(g).filter(k => !order.includes(k)).sort());
    aoa.push([], [title], ['Category', 'Count', 'Avg severity']);
    keys.forEach(k => {
      const s = g[k].filter(x => x !== '');
      aoa.push([k, g[k].length, s.length ? xlRound(s.reduce((a, b) => a + b, 0) / s.length) : '']);
    });
  };
  group('By trigger', 'Trigger', Object.values(XL_LABELS.trigger));
  group('By distance', 'Distance', Object.values(XL_LABELS.distance));
  group('By recovery time', 'Recovery', Object.values(XL_LABELS.recovery));
  aoa.push([], ['By severity'], ['Severity', 'Count']);
  for (let s = 1; s <= 5; s++) aoa.push([XL_SEV_LABELS[s], sevs.filter(x => x === s).length]);
  // Weekly trend (weeks start Monday), including empty weeks
  aoa.push([], ['Weekly trend (week starting Monday)'], ['Week of', 'Incidents', 'Avg severity']);
  const wk = {};
  const monday = ds => { const [y, m, d] = ds.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7)); return dt; };
  rows.forEach(r => { const k = monday(r.Date).toISOString().slice(0, 10); (wk[k] = wk[k] || []).push(r['Severity (1-5)']); });
  const wkeys = Object.keys(wk).sort();
  if (wkeys.length) {
    const end = new Date(wkeys[wkeys.length - 1] + 'T00:00:00Z');
    for (let d = new Date(wkeys[0] + 'T00:00:00Z'); d <= end; d.setUTCDate(d.getUTCDate() + 7)) {
      const k = d.toISOString().slice(0, 10), v = wk[k] || [], s = v.filter(x => x !== '');
      aoa.push([k, v.length, s.length ? xlRound(s.reduce((a, b) => a + b, 0) / s.length) : '']);
    }
  }
  return aoa;
}

function loadSheetJS() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = XLSX_CDN;
    s.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error('SheetJS failed to load'));
    s.onerror = () => reject(new Error('Could not load SheetJS (are you offline?)'));
    document.head.appendChild(s);
  });
}

function buildWorkbook(XLSX, data) {
  const rows = buildIncidentRows(data);
  const header = ['Date', 'Logged at (local time)', 'Trigger', 'Distance', 'Severity (1-5)', 'Recovery', 'Cue used', 'Notes', 'Has photo'];
  const ws1 = XLSX.utils.json_to_sheet(rows, { header });
  ws1['!cols'] = [12, 20, 22, 10, 13, 17, 40, 70, 10].map(wch => ({ wch }));
  ws1['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(rows.length, 1), c: header.length - 1 } }) };
  const ws2 = XLSX.utils.aoa_to_sheet(buildSummaryAoa(rows));
  ws2['!cols'] = [{ wch: 34 }, { wch: 12 }, { wch: 14 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'Incidents');
  XLSX.utils.book_append_sheet(wb, ws2, 'Summary');
  return wb;
}

document.getElementById('exportXlsxBtn').onclick = async () => {
  const btn = document.getElementById('exportXlsxBtn');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const XLSX = await loadSheetJS();
    XLSX.writeFile(buildWorkbook(XLSX, loadData()), 'max_reactivity_log.xlsx');
  } catch (err) {
    alert('Excel export failed: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
};

// ---- Google Sheet sync (settings + pending queue live in their own localStorage keys) ----
const SYNC_URL_KEY = 'max_sheet_sync_url';
const SYNC_SECRET_KEY = 'max_sheet_sync_secret';
const SYNC_QUEUE_KEY = 'max_sheet_sync_pending';
function syncConfig() {
  return { url: (localStorage.getItem(SYNC_URL_KEY) || '').trim(), secret: localStorage.getItem(SYNC_SECRET_KEY) || '' };
}
function syncPayload(date, inc, replaces) {
  const p = { date, trigger: inc.trigger, distance: inc.distance, severity: inc.severity, recovery: inc.recovery,
    cue: inc.cue || '', notes: inc.notes || '', time: inc.time, hasPhoto: !!inc.photo };
  if (replaces && replaces !== inc.time) p.replaces = replaces;
  return p;
}
function loadQueue() { try { return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY)) || []; } catch (e) { return []; } }
function saveQueue(q) { if (q.length) localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); else localStorage.removeItem(SYNC_QUEUE_KEY); }
function setSyncStatus(msg) { const el = document.getElementById('syncStatus'); if (el) el.textContent = msg; }
function queueIncidents(list) {
  const q = loadQueue();
  list.forEach(p => { if (!q.some(x => x.time === p.time)) q.push(p); });
  saveQueue(q);
}
// Sends with no-cors: the response is opaque, so only network failures can be detected.
async function postToSheet(list) {
  const { url, secret } = syncConfig();
  if (!url || !list.length) return false;
  try {
    await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ secret, incidents: list }) });
    return true;
  } catch (e) {
    queueIncidents(list);
    return false;
  }
}
async function flushSyncQueue() {
  const q = loadQueue();
  if (!q.length || !syncConfig().url) return;
  saveQueue([]);
  const ok = await postToSheet(q);
  setSyncStatus(ok ? `Sent ${q.length} pending incident(s).` : `${loadQueue().length} incident(s) waiting to sync.`);
}
async function syncIncident(date, inc, replaces) {
  if (!syncConfig().url) return;
  await flushSyncQueue();
  const ok = await postToSheet([syncPayload(date, inc, replaces)]);
  setSyncStatus(ok ? 'Last incident sent to Sheet.' : `Offline? ${loadQueue().length} incident(s) waiting to sync.`);
}
function allIncidentPayloads() {
  const data = loadData(), list = [];
  Object.keys(data).sort().forEach(d => (data[d] || []).forEach(i => { if (i && i.time) list.push(syncPayload(d, i)); }));
  return list;
}
document.getElementById('syncUrl').value = syncConfig().url;
document.getElementById('syncSecret').value = syncConfig().secret;
document.getElementById('syncSaveBtn').onclick = () => {
  localStorage.setItem(SYNC_URL_KEY, document.getElementById('syncUrl').value.trim());
  localStorage.setItem(SYNC_SECRET_KEY, document.getElementById('syncSecret').value.trim());
  setSyncStatus('Sync settings saved.');
  flushSyncQueue();
};
document.getElementById('syncAllBtn').onclick = async () => {
  if (!syncConfig().url) { setSyncStatus('Paste the web app URL and save first.'); return; }
  const list = allIncidentPayloads();
  saveQueue(loadQueue().filter(p => !list.some(x => x.time === p.time)));
  await flushSyncQueue();
  const ok = await postToSheet(list);
  setSyncStatus(ok ? `Sent ${list.length} incident(s); duplicates are skipped by the Sheet.` : `Couldn't reach the Sheet; ${loadQueue().length} incident(s) queued.`);
};
flushSyncQueue();


// --- Pinch-zoom full-screen photo viewer ---
const photoViewerState = {
  scale: 1,
  minScale: 1,
  maxScale: 5,
  tx: 0,
  ty: 0,
  pointers: new Map(),
  pinchDist: 0,
  pinchScale: 1,
  pinchTx: 0,
  pinchTy: 0,
  pinchCX: 0,
  pinchCY: 0,
  dragTx: 0,
  dragTy: 0,
  moved: false,
  lastTapAt: 0,
  lastTapX: 0,
  lastTapY: 0,
  suppressClick: false
};

function pvEls() {
  return {
    root: document.getElementById('photoViewer'),
    stage: document.getElementById('photoViewerStage'),
    img: document.getElementById('photoViewerImg'),
    closeBtn: document.getElementById('photoViewerClose')
  };
}

function applyPhotoTransform() {
  const { img } = pvEls();
  const s = photoViewerState;
  if (!img) return;
  img.style.transform = `translate(${s.tx}px, ${s.ty}px) scale(${s.scale})`;
}

function clampPhotoPan() {
  const { stage, img } = pvEls();
  const s = photoViewerState;
  if (!stage || !img || !img.naturalWidth) return;
  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  const w = img.naturalWidth * s.scale;
  const h = img.naturalHeight * s.scale;
  if (w <= sw) {
    s.tx = (sw - w) / 2;
  } else {
    s.tx = Math.min(0, Math.max(sw - w, s.tx));
  }
  if (h <= sh) {
    s.ty = (sh - h) / 2;
  } else {
    s.ty = Math.min(0, Math.max(sh - h, s.ty));
  }
}

function fitPhotoViewer() {
  const { stage, img } = pvEls();
  const s = photoViewerState;
  if (!stage || !img || !img.naturalWidth) return;
  const pad = 20;
  const sx = (stage.clientWidth - pad * 2) / img.naturalWidth;
  const sy = (stage.clientHeight - pad * 2) / img.naturalHeight;
  s.minScale = Math.min(sx, sy);
  if (!isFinite(s.minScale) || s.minScale <= 0) s.minScale = 0.1;
  s.scale = s.minScale;
  s.tx = (stage.clientWidth - img.naturalWidth * s.scale) / 2;
  s.ty = (stage.clientHeight - img.naturalHeight * s.scale) / 2;
  img.style.width = img.naturalWidth + 'px';
  img.style.height = img.naturalHeight + 'px';
  applyPhotoTransform();
}

function zoomPhotoAt(clientX, clientY, nextScale) {
  const { stage, img } = pvEls();
  const s = photoViewerState;
  if (!stage || !img) return;
  const rect = stage.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const clamped = Math.max(s.minScale, Math.min(s.maxScale, nextScale));
  const ratio = clamped / s.scale;
  s.tx = x - (x - s.tx) * ratio;
  s.ty = y - (y - s.ty) * ratio;
  s.scale = clamped;
  clampPhotoPan();
  applyPhotoTransform();
}

function openPhotoViewer(src) {
  const { root, img } = pvEls();
  if (!root || !img || !src) return;
  photoViewerState.pointers.clear();
  photoViewerState.moved = false;
  photoViewerState.suppressClick = false;
  const show = () => {
    fitPhotoViewer();
  };
  img.onload = show;
  img.src = src;
  root.classList.add('open');
  root.setAttribute('aria-hidden', 'false');
  document.body.classList.add('photo-viewer-open');
  if (img.complete && img.naturalWidth) show();
}

function closePhotoViewer() {
  const { root, img } = pvEls();
  if (!root) return;
  root.classList.remove('open');
  root.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('photo-viewer-open');
  photoViewerState.pointers.clear();
  if (img) {
    img.onload = null;
    img.removeAttribute('src');
    img.style.transform = '';
  }
}

function pvPointerDist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function initPhotoViewer() {
  const { root, stage, img, closeBtn } = pvEls();
  if (!root || !stage || !img || root.dataset.ready) return;
  root.dataset.ready = '1';

  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closePhotoViewer();
  });

  // Backdrop / empty area tap closes (not when image was panned/zoomed interaction)
  root.addEventListener('click', (e) => {
    if (photoViewerState.suppressClick) {
      photoViewerState.suppressClick = false;
      return;
    }
    if (e.target === root || e.target === stage) closePhotoViewer();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && root.classList.contains('open')) {
      e.preventDefault();
      closePhotoViewer();
    }
  });

  stage.addEventListener('wheel', (e) => {
    if (!root.classList.contains('open')) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    zoomPhotoAt(e.clientX, e.clientY, photoViewerState.scale * factor);
  }, { passive: false });

  const onPointerDown = (e) => {
    if (!root.classList.contains('open')) return;
    stage.setPointerCapture(e.pointerId);
    photoViewerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    photoViewerState.moved = false;
    if (photoViewerState.pointers.size === 1) {
      photoViewerState.dragTx = photoViewerState.tx;
      photoViewerState.dragTy = photoViewerState.ty;
      photoViewerState._downX = e.clientX;
      photoViewerState._downY = e.clientY;
    } else if (photoViewerState.pointers.size === 2) {
      const pts = [...photoViewerState.pointers.values()];
      photoViewerState.pinchDist = pvPointerDist(pts[0], pts[1]);
      photoViewerState.pinchScale = photoViewerState.scale;
      photoViewerState.pinchTx = photoViewerState.tx;
      photoViewerState.pinchTy = photoViewerState.ty;
      photoViewerState.pinchCX = (pts[0].x + pts[1].x) / 2;
      photoViewerState.pinchCY = (pts[0].y + pts[1].y) / 2;
    }
  };

  const onPointerMove = (e) => {
    if (!photoViewerState.pointers.has(e.pointerId)) return;
    photoViewerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const s = photoViewerState;

    if (s.pointers.size === 2) {
      const pts = [...s.pointers.values()];
      const dist = pvPointerDist(pts[0], pts[1]);
      if (s.pinchDist > 0) {
        const next = s.pinchScale * (dist / s.pinchDist);
        const cx = (pts[0].x + pts[1].x) / 2;
        const cy = (pts[0].y + pts[1].y) / 2;
        // Restore pinch-start transform, then zoom toward current midpoint
        s.scale = s.pinchScale;
        s.tx = s.pinchTx;
        s.ty = s.pinchTy;
        zoomPhotoAt(s.pinchCX, s.pinchCY, next);
        // Also pan by midpoint delta
        s.tx += cx - s.pinchCX;
        s.ty += cy - s.pinchCY;
        clampPhotoPan();
        applyPhotoTransform();
        s.moved = true;
      }
      e.preventDefault();
      return;
    }

    if (s.pointers.size === 1) {
      const dx = e.clientX - s._downX;
      const dy = e.clientY - s._downY;
      if (Math.hypot(dx, dy) > 4) s.moved = true;
      if (s.scale > s.minScale + 0.001) {
        s.tx = s.dragTx + dx;
        s.ty = s.dragTy + dy;
        clampPhotoPan();
        applyPhotoTransform();
      }
      e.preventDefault();
    }
  };

  const onPointerUp = (e) => {
    if (!photoViewerState.pointers.has(e.pointerId)) return;
    const s = photoViewerState;
    const wasPinching = s.pointers.size >= 2;
    s.pointers.delete(e.pointerId);

    if (s.pointers.size === 1) {
      const rem = [...s.pointers.values()][0];
      s._downX = rem.x;
      s._downY = rem.y;
      s.dragTx = s.tx;
      s.dragTy = s.ty;
    }

    if (wasPinching) {
      s.suppressClick = true;
      return;
    }

    // Only treat as a pan gesture when zoomed; tiny moves on the backdrop still close
    if (s.moved && s.scale > s.minScale + 0.001) {
      s.suppressClick = true;
      return;
    }

    // Double-tap / double-click toggle zoom toward point
    const now = Date.now();
    const dt = now - s.lastTapAt;
    const dist = Math.hypot(e.clientX - s.lastTapX, e.clientY - s.lastTapY);
    if (dt < 320 && dist < 40) {
      s.suppressClick = true;
      if (s.scale > s.minScale * 1.15) {
        fitPhotoViewer();
      } else {
        zoomPhotoAt(e.clientX, e.clientY, Math.min(s.maxScale, s.minScale * 2.5));
      }
      s.lastTapAt = 0;
    } else {
      s.lastTapAt = now;
      s.lastTapX = e.clientX;
      s.lastTapY = e.clientY;
      // Single tap on image: do not close (backdrop / empty stage handles close)
      if (e.target === img || (e.target === stage && s.moved)) s.suppressClick = true;
      // If tap landed on empty stage (dark area) without a drag, allow click to close
      if (e.target === stage && !s.moved) s.suppressClick = false;
    }
  };

  stage.addEventListener('pointerdown', onPointerDown);
  stage.addEventListener('pointermove', onPointerMove);
  stage.addEventListener('pointerup', onPointerUp);
  stage.addEventListener('pointercancel', onPointerUp);
  stage.addEventListener('pointerleave', (e) => {
    if (photoViewerState.pointers.has(e.pointerId)) onPointerUp(e);
  });

  // Prevent iOS bounce / page scroll while viewer open
  const blockScroll = (e) => {
    if (document.body.classList.contains('photo-viewer-open')) e.preventDefault();
  };
  document.addEventListener('touchmove', blockScroll, { passive: false });

  window.addEventListener('resize', () => {
    if (root.classList.contains('open')) fitPhotoViewer();
  });
}

initPhotoViewer();

// Close modal on outside click
document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};

renderCalendar();
loadPhoto();

// Profile photo — plain visible file input (works on mobile)
document.getElementById('photoInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => savePhoto(reader.result);
  reader.readAsDataURL(file);
  e.target.value = '';
};
</script>
